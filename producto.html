<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Pieza — Aurelia Atelier</title>
  <meta name="theme-color" content="#9a7432" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>AURELIA ATELIER</span>
      </a>

      <nav class="nav-links" data-nav-links aria-label="Navegación principal">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="catalogo.html" class="nav-link">Catálogo</a>
        <a href="carrito.html" class="nav-link">Carrito y Favoritos</a>
        <a href="contacto.html" class="nav-link">Contacto</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false">
          <span aria-hidden="true">☾</span>
          <span class="btn-label">Oscuro</span>
        </button>

        <a href="carrito.html" class="icon-btn" aria-label="Ver favoritos">
          <span aria-hidden="true">♡</span>
          <span class="btn-label">Favoritos</span>
          <span class="counter-pill" data-fav-count>0</span>
        </a>

        <a href="carrito.html" class="icon-btn" aria-label="Ver carrito de compras">
          <span aria-hidden="true">☰</span>
          <span class="btn-label">Carrito</span>
          <span class="counter-pill" data-cart-count>0</span>
        </a>

        <button
          type="button"
          class="menu-toggle"
          data-menu-toggle
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          ≡
        </button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <nav class="breadcrumb" aria-label="Ruta de navegación">
        <a href="index.html">Inicio</a>
        <span aria-hidden="true">/</span>
        <a href="catalogo.html">Catálogo</a>
        <span aria-hidden="true">/</span>
        <span data-breadcrumb-name>Detalle</span>
      </nav>

      <div data-product-detail>
        <p class="section-subtitle">Cargando información de la pieza...</p>
      </div>

      <section class="section" style="padding-bottom: 0;">
        <div class="section-header">
          <div>
            <span class="section-eyebrow">Complementos Sugeridos</span>
            <h2 class="section-title">Piezas relacionadas</h2>
          </div>
          <a href="catalogo.html" class="btn btn-ghost">Ver todo el catálogo →</a>
        </div>
        <div class="products-grid" data-related-products></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Aurelia Atelier. Todos los derechos reservados.</span>
        <a href="catalogo.html">Volver al catálogo</a>
      </div>
    </div>
  </footer>

  <script type="module" src="js/producto.js"></script>
</body>
</html>
